# Netlify deploy config for the Vite + React SPA.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # These VITE_FIREBASE_* values are public by design — Vite inlines them into
  # the client bundle on every build, and Firebase Web config is not a secret
  # (access is enforced by Firestore rules + Auth, not by hiding this key).
  # Without this, Netlify's secrets scanner fails the build on a false positive.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"

# Serverless SMS sender (netlify/functions/send-sms.js). Reachable at
# /.netlify/functions/send-sms once the SMS_* env vars are set in the Netlify UI.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Client-side routing: every unknown path serves index.html (real files —
# assets, sw.js, manifest.webmanifest — are matched first and served as-is).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the service worker or the app shell.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
